name: FzServerGuardian

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fzserverguardian-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore monitoring state
        uses: actions/cache/restore@v4
        with:
          path: state/guardian-state.json
          key: fzguardian-state-${{ github.run_id }}
          restore-keys: |
            fzguardian-state-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test Pterodactyl API
        continue-on-error: true
        env:
          HEXACRAFT_API_KEY: ${{ secrets.HEXACRAFT_API_KEY }}
          HEAVYCORE_API_KEY: ${{ secrets.HEAVYCORE_API_KEY }}
        run: npm run test-api

      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report-${{ github.run_id }}
          path: diagnose-out/api-test-report.*
          if-no-files-found: ignore
          retention-days: 3

      - name: Run FzServerGuardian (API mode)
        env:
          HEXACRAFT_API_KEY: ${{ secrets.HEXACRAFT_API_KEY }}
          HEAVYCORE_API_KEY: ${{ secrets.HEAVYCORE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OFFLINE_CONFIRMATIONS: "2"
          START_COOLDOWN_MINUTES: "60"
          START_VERIFY_WAIT_MS: "120000"
        run: npm start

      - name: Save monitoring state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/guardian-state.json
          key: fzguardian-state-${{ github.run_id }}
